name: nodeguard
services:
  nodeguard_postgres:
    container_name: nodeguard_postgres
    image: postgres:16
    restart: always
    environment:
      POSTGRES_DB: nodeguard
      POSTGRES_USER: rw_dev
      POSTGRES_PASSWORD: rw_dev
      TZ: Europe/Madrid
    volumes:
      - nodeguard_postgres_data:/var/lib/postgresql/data
    ports:
      - 25432:5432

  nbxplorer:
    restart: unless-stopped
    image: ghcr.io/elenpay/nbxplorer:elenpay-develop
    platform: linux/amd64
    hostname: nbxplorer
    ports:
      - "32838:32838"
    depends_on:
      - nbxplorer_postgres
    environment:
      NBXPLORER_NETWORK: regtest
      NBXPLORER_BIND: 0.0.0.0:32838
      NBXPLORER_TRIMEVENTS: 10000
      NBXPLORER_SIGNALFILESDIR: /datadir
      #Keeping dbtrie for dev until it is fully removed since we would need to modify nbxplorer docker image to wait for the db to be ready
      NBXPLORER_DBTRIE: 0
      NBXPLORER_POSTGRES: Host=nbxplorer_postgres;Port=5432;Database=nbxplorer;Username=rw_dev;Password=rw_dev
      NBXPLORER_CHAINS: "btc"
      NBXPLORER_BTCRPCUSER: "polaruser"
      NBXPLORER_BTCRPCPASSWORD: "polarpass"
      NBXPLORER_BTCRPCURL: http://host.docker.internal:18443/
      NBXPLORER_BTCNODEENDPOINT: host.docker.internal:19444
    command: ["--noauth"]
    volumes:
      - "bitcoin_datadir:/root/.bitcoin"

  nbxplorer_postgres:
    container_name: nbxplorer_postgres
    image: postgres:16
    restart: always
    environment:
      POSTGRES_DB: nbxplorer
      POSTGRES_USER: rw_dev
      POSTGRES_PASSWORD: rw_dev
      TZ: Europe/Madrid
    volumes:
      - nbxplorer_postgres_data:/var/lib/postgresql/data
    ports:
      - 35432:5432
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "rw_dev"]
      interval: 10s
      timeout: 5s
      retries: 5

  boltz:
    container_name: boltz
    image: boltz/boltz-client:latest
    restart: unless-stopped
    environment:
      LOGLEVEL: "info"
      Network: "regtest"
    volumes:
      - boltz_data_dir:/root/.boltz
      - ./boltz/config.toml:/root/.boltz/boltz.toml
      - ./boltz/carol-admin.macaroon:/root/.lnd/admin.macaroon
      - ./boltz/carol-tls.cert:/root/.lnd/tls.cert

  boltz-backend:
    container_name: boltz_backend
    image: boltz/boltz:latest
    restart: unless-stopped
    platform: linux/amd64
    volumes:
      - ./boltz/config-backend.toml:/root/.boltz/boltz.conf
      - ./boltz/alice-admin.macaroon:/root/.lnd/admin.macaroon
      - ./boltz/alice-tls.cert:/root/.lnd/tls.cert
    ports:
      - "9000:9000"
      - "9001:9001"
      - "9003:9003"
      - "9004:9004"
      - "9005:9005"
      - "9009:9009"

  boltz-postgres:
    container_name: boltz_postgres
    image: postgres:16
    restart: always
    environment:
      POSTGRES_DB: boltz
      POSTGRES_USER: boltz
      POSTGRES_PASSWORD: boltz
      TZ: Europe/Madrid
    volumes:
      - boltz_backend_data_dir:/var/lib/postgresql/data
    ports:
      - 35433:5432
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "rw_dev"]
      interval: 10s
      timeout: 5s
      retries: 5

  electrumx:
    image: andgohq/electrumx:1.8.7
    container_name: electrumx
    ports:
      - "51002:50002"
      - "51001:50001"
    expose:
      - "50001"
      - "50002"
    volumes:
      - electrumx-data:/data
    environment:
      # bitcoind is valid
      - DAEMON_URL=http://polaruser:polarpass@host.docker.internal:18443
      - COIN=BitcoinSegwit
      - NET=regtest
      # 127.0.0.1 or electrumx is valid for RPC_HOST
      - RPC_HOST=electrumx
      - RPC_PORT=18443
      - HOST=electrumx
      - TCP_PORT=50001
      - SSL_PORT=50002
    restart: always

volumes:
  nodeguard_postgres_data:
  bitcoin_datadir:
  nbxplorer_datadir:
  nbxplorer_postgres_data:
  nodeguard_data_keys_dir:
  boltz_data_dir:
  boltz_backend_data_dir:
  electrumx-data:
